name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s scripts -p "test_*.py"
      - run: uv run --frozen python -m unittest discover -s tools -p "test_*.py"
      - run: uv run --frozen python scripts/candidate.py verify-assets
      - run: uv run --frozen python scripts/scores.py verify-baseline
      - run: uv run --frozen python scripts/validate_skill.py
      - run: uv run --frozen python tools/check_publication.py
      - run: uv run --frozen python experiments/tools/test_export_beam.py
      - run: uv run --frozen python experiments/tools/export_dual.py --verify experiments/dual-free-20261018
      - run: uv run --frozen python experiments/reference-view-20261018/renderer.py selftest
      - run: uv run --frozen python experiments/reference-view-20261018/renderer.py verify

  docs:
    name: Documentation build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv run --frozen python tools/verify_site.py

  runtime:
    name: Offline FreeCAD integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - name: Start a dedicated local Podman connection
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user start podman.socket
          podman system connection add secca-ci "unix:///run/user/$(id -u)/podman/podman.sock"
      - run: uv sync --frozen
      - name: Build the source-bound runtime
        run: uv run --frozen python scripts/candidate.py build --connection secca-ci --tag localhost/kart-sbx-secca:ci
      - name: Run FreeCAD MCP and gateway integration without model inference
        run: uv run --frozen python scripts/verify_runtime.py --connection secca-ci --image localhost/kart-sbx-secca:ci --output "${{ runner.temp }}/secca-runtime"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secca-runtime-proof
          path: ${{ runner.temp }}/secca-runtime
          if-no-files-found: warn
